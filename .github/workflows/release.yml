name: Draft prerelease

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: Verify release tag
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify annotated tag on main
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tagType = git cat-file -t "refs/tags/$env:TAG"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($tagType.Trim() -ne 'tag') { throw 'Release tag must be annotated.' }
          $commit = git rev-parse "$env:TAG^{}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $commit = $commit.Trim()
          if ($commit -ne $env:GITHUB_SHA) { throw 'Tag target does not match the workflow commit.' }
          git merge-base --is-ancestor $commit origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release commit is not contained in origin/main.' }

  release-gate:
    needs: verify-tag
    uses: ./.github/workflows/verify.yml

  package:
    name: Release assets
    needs: release-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.16.0"
      - name: Recheck tag and release metadata
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test "$(git cat-file -t "refs/tags/$TAG")" = tag
          test "$(git rev-parse "$TAG^{}")" = "$GITHUB_SHA"
          npm run verify:release -- --tag "$TAG"
      - name: Build source archive and SPDX SBOMs
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p dist/release
          git archive --format=tar --prefix="neura-v${version}/" "$GITHUB_SHA" | gzip -n -9 > "dist/release/neura-v${version}.tar.gz"
          git archive --format=zip --prefix="neura-v${version}/" --output="dist/release/neura-v${version}.zip" "$GITHUB_SHA"
          npm sbom --package-lock-only --sbom-format spdx > "dist/release/spdx-root.json"
          npm sbom --prefix agent/neura --package-lock-only --sbom-format spdx > "dist/release/spdx-learning-runtime.json"
          cp "docs/releases/v${version}.md" dist/release/RELEASE_NOTES.md
          (
            cd dist/release
            sha256sum "neura-v${version}.tar.gz" "neura-v${version}.zip" spdx-root.json spdx-learning-runtime.json | LC_ALL=C sort > SHA256SUMS
          )
      - name: Upload gated release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-${{ github.run_attempt }}
          path: dist/release
          if-no-files-found: error
          retention-days: 3

  release:
    name: Create draft prerelease
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Revalidate remote annotated tag
        run: |
          set -euo pipefail
          tag_object="$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object | select(.type == "tag") | .sha')"
          test -n "$tag_object"
          commit="$(gh api "repos/$GH_REPO/git/tags/$tag_object" --jq '.object | select(.type == "commit") | .sha')"
          test "$commit" = "$GITHUB_SHA"
      - name: Download gated artifact with GitHub CLI
        run: |
          set -euo pipefail
          # A release-only retry gets a new run_attempt without rerunning package.
          artifact_id="$(gh api "repos/$GH_REPO/actions/runs/${{ github.run_id }}/artifacts?per_page=100" --jq '[.artifacts[] | select(.expired == false and (.name | test("^release-assets-[0-9]+$")))] | sort_by(.created_at) | last | .id // empty')"
          test -n "$artifact_id"
          gh api "repos/$GH_REPO/actions/artifacts/$artifact_id/zip" > release-assets.zip
          mkdir release-assets
          unzip -q release-assets.zip -d release-assets
      - name: Create draft prerelease with GitHub CLI
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            release-assets/neura-*.tar.gz \
            release-assets/neura-*.zip \
            release-assets/spdx-root.json \
            release-assets/spdx-learning-runtime.json \
            release-assets/SHA256SUMS \
            --draft \
            --prerelease \
            --verify-tag \
            --title "Neura $TAG" \
            --notes-file release-assets/RELEASE_NOTES.md
