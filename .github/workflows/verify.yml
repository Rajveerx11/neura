name: Neura CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: harness
    runs-on: windows-2025
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan complete history for secrets
        shell: pwsh
        run: powershell -NoProfile -File .\scripts\verify-secrets.ps1

      - name: Verify secret scanner failure paths
        shell: pwsh
        run: powershell -NoProfile -File .\scripts\verify-secrets.tests.ps1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            agent/neura/package-lock.json

      - name: Provision pinned Git runtime
        shell: pwsh
        run: |
          $contract = Get-Content -LiteralPath .\agent\neura\runtime-contract.json -Raw | ConvertFrom-Json
          $git = $contract.automaticExecutables.git
          $archive = Join-Path $env:RUNNER_TEMP $git.windowsArchive
          $destination = Join-Path $env:RUNNER_TEMP "neura-git-2.50.1"
          Invoke-WebRequest -Uri $git.windowsArchiveUrl -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $git.windowsArchiveSha256) { throw "Pinned Git archive integrity check failed." }
          $extract = Start-Process -FilePath $archive -ArgumentList "-o$destination", "-y" -Wait -PassThru -WindowStyle Hidden
          if ($extract.ExitCode -ne 0) { throw "Pinned Git extraction failed with exit code $($extract.ExitCode)." }
          "NEURA_GIT_EXECUTABLE=$(Join-Path $destination 'cmd\git.exe')" >> $env:GITHUB_ENV

      - name: Install locked development dependencies
        run: npm ci --ignore-scripts

      - name: Install locked learning document runtime
        run: npm ci --prefix agent/neura --ignore-scripts

      - name: Audit dependency vulnerabilities and registry signatures
        run: |
          npm run audit:dependencies
          npm run audit:signatures

      - name: Verify Pi version
        shell: pwsh
        run: |
          if ((& .\node_modules\.bin\pi.cmd --version).Trim() -ne '0.85.1') { throw 'Unexpected repository Pi version' }

      - name: Verify repository
        run: npm run verify

      - name: Verify browsers
        env:
          NEURA_A11Y_OUTPUT: ${{ runner.temp }}\neura-a11y
        run: npm run test:browser

      - name: Upload plan accessibility snapshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plan-accessibility-${{ github.run_attempt }}
          path: ${{ runner.temp }}\neura-a11y
          if-no-files-found: warn
          retention-days: 7

      - name: Check changed whitespace
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          $zero = '0000000000000000000000000000000000000000'
          if ($env:EVENT_NAME -eq 'pull_request') {
            git diff --check $env:PR_BASE $env:PR_HEAD
          } elseif ($env:EVENT_NAME -eq 'push' -and $env:PUSH_BEFORE -and $env:PUSH_BEFORE -ne $zero) {
            git diff --check $env:PUSH_BEFORE $env:PUSH_AFTER
          } elseif ($env:EVENT_NAME -eq 'push') {
            git diff-tree --check --root --no-commit-id -r $env:PUSH_AFTER
          } elseif ($env:EVENT_NAME -eq 'merge_group') {
            git diff --check $env:MERGE_BASE $env:MERGE_HEAD
          } elseif (git rev-parse --verify HEAD^ 2>$null) {
            git diff --check HEAD^ HEAD
          } else {
            git diff-tree --check --root --no-commit-id -r HEAD
          }

      - name: Verify Windows installer and live drift check
        shell: pwsh
        run: |
          $env:PATH = "$PWD\node_modules\.bin;$env:PATH"
          powershell -File .\install.ps1
          powershell -File .\install.ps1 -Check

  portable-proof:
    name: portable-proof
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: node scripts/verify-harness.mjs --suite proof
      - run: node scripts/verify-harness.mjs --suite approval-storage
      - run: node scripts/verify-harness.mjs --suite sandbox
      - run: node scripts/verify-harness.mjs --suite learn-storage
      - run: node scripts/verify-harness.mjs --suite learn-vault

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294

  required-ci:
    name: Required CI
    if: always()
    needs: [harness, portable-proof, dependency-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Enforce required results
        env:
          HARNESS_RESULT: ${{ needs.harness.result }}
          PORTABLE_RESULT: ${{ needs.portable-proof.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-review.result }}
        run: |
          test "$HARNESS_RESULT" = success
          test "$PORTABLE_RESULT" = success
          test "$DEPENDENCY_RESULT" = success -o "$DEPENDENCY_RESULT" = skipped
