name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan complete history for secrets
        shell: pwsh
        run: powershell -NoProfile -File .\scripts\verify-secrets.ps1

      - name: Verify secret scanner failure paths
        shell: pwsh
        run: powershell -NoProfile -File .\scripts\verify-secrets.tests.ps1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.16.0"
          cache: npm

      - name: Install locked development dependencies
        run: npm ci --ignore-scripts

      - name: Install locked learning document runtime
        run: npm ci --prefix agent/neura --ignore-scripts

      - name: Audit dependency vulnerabilities and registry signatures
        run: |
          npm audit --audit-level=high
          npm audit signatures
          npm audit --prefix agent/neura --audit-level=high
          npm audit signatures --prefix agent/neura

      - name: Verify Pi version and TypeScript
        shell: pwsh
        run: |
          if ((& .\node_modules\.bin\pi.cmd --version).Trim() -ne '0.84.4') { throw 'Unexpected repository Pi version' }
          npm run typecheck

      - name: Verify independent hermetic suites
        run: node scripts\verify-harness.mjs

      - name: Verify Learn workshop in browser
        run: node scripts/tests/learn-browser.mjs

      - name: Verify generated plan accessibility
        shell: pwsh
        env:
          NEURA_A11Y_OUTPUT: ${{ runner.temp }}\neura-a11y
        run: npm run test:accessibility

      - name: Upload plan accessibility snapshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plan-accessibility-${{ github.run_attempt }}
          path: ${{ runner.temp }}\neura-a11y
          if-no-files-found: warn
          retention-days: 7

      - name: Verify documentation and release files
        run: node scripts\check-docs.mjs

      - name: Check whitespace
        run: git diff --check HEAD~1 HEAD

      - name: Verify Windows installer and live drift check
        shell: pwsh
        run: |
          $env:PATH = "$PWD\node_modules\.bin;$env:PATH"
          python -m pip install uv==0.12.11
          powershell -File .\install.ps1
          powershell -File .\install.ps1 -Check

  portable-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.16.0"
      - run: node scripts/verify-harness.mjs --suite proof
      - run: node scripts/verify-harness.mjs --suite approval-storage
      - run: node scripts/verify-harness.mjs --suite sandbox
      - run: node scripts/verify-harness.mjs --suite learn-storage
      - run: node scripts/verify-harness.mjs --suite learn-vault
