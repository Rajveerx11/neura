name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan complete history for secrets
        shell: pwsh
        run: powershell -NoProfile -File .\scripts\verify-secrets.ps1

      - name: Verify secret scanner failure paths
        shell: pwsh
        run: powershell -NoProfile -File .\scripts\verify-secrets.tests.ps1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.16.0"
          cache: npm

      - name: Install locked development dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependency vulnerabilities and registry signatures
        run: |
          npm audit --audit-level=high
          npm audit signatures

      - name: Install verified Pi version
        run: npm install --global @earendil-works/pi-coding-agent@0.84.4

      - name: Verify Pi version and TypeScript
        shell: pwsh
        run: |
          if ((pi --version) -notmatch '0\.84\.4') { throw "Unexpected Pi version: $(pi --version)" }
          npm run typecheck

      - name: Verify extensions
        run: node scripts\verify-harness.mjs

      - name: Verify generated plan accessibility
        shell: pwsh
        env:
          NEURA_A11Y_OUTPUT: ${{ runner.temp }}\neura-a11y
        run: npm run test:accessibility

      - name: Upload plan accessibility snapshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plan-accessibility-${{ github.run_attempt }}
          path: ${{ runner.temp }}\neura-a11y
          if-no-files-found: warn
          retention-days: 7

      - name: Verify documentation and release files
        run: node scripts\check-docs.mjs

      - name: Check whitespace
        run: git diff --check HEAD~1 HEAD

      - name: Verify Windows installer and live drift check
        shell: pwsh
        run: |
          python -m pip install uv==0.11.7
          powershell -File .\install.ps1
          powershell -File .\install.ps1 -Check
