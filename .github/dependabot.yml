version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    target-branch: main
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /agent/neura
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Etc/UTC
    target-branch: main
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Etc/UTC
    target-branch: main
    open-pull-requests-limit: 5
    groups:
      codeql-actions:
        patterns:
          - "github/codeql-action/*"
    labels:
      - dependencies
